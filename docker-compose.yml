services:
  web:
    container_name: overbrand-website
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}
      - traefik.http.routers.overbrand-website.rule=${TRAEFIK_HOST_RULE}
      - traefik.http.routers.overbrand-website.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}
      - traefik.http.routers.overbrand-website.tls=true
      - traefik.http.routers.overbrand-website.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.overbrand-website.loadbalancer.server.port=3000

networks:
  dokploy-network:
    external: true
    name: ${TRAEFIK_NETWORK:-dokploy-network}
